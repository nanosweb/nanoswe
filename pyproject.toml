# Dependency manifest for the nanoswe training code. This is NOT an installable
# package: clone the repo and run from its root (record.sh, which calls
# `torchrun -m scripts.base_train`). `uv sync` provisions the dependency env only.
[project]
name = "nanoswe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "kernels>=0.11.7",     # FA4 kernel fetch (flash_attention.py)
    "psutil>=7.1.0",       # memory stats (report.py)
    "pyarrow>=17.0.0",     # parquet reads (dataloader / dataset)
    "requests>=2.31.0",    # shard download (dataset.py)
    "rustbpe>=0.1.0",      # tokenizer training
    "tiktoken>=0.11.0",    # tokenizer inference
    "torch==2.9.1",
    "wandb>=0.21.3",       # run logging (optional; WANDB_MODE=disabled to skip)
]

[tool.uv]
package = false            # deps-only: do NOT build/install this repo as a package

# torch from the CUDA 12.8 wheel index (H100/B200 training)
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
