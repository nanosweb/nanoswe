    chmod +x /usr/local/bin/str_replace
    command -v python3 >/dev/null || ln -sf "$(command -v python)" /usr/local/bin/python3
    str_replace --help 2>/dev/null || true
    echo "[startup] str_replace installed at /usr/local/bin/str_replace"
    # Scrub /testbed git history past base_commit. The container ships with the
    # full upstream history (including the fix commit) — `git log` would let the
    # agent locate the fix and `git checkout <fix> -- .` would dump the gold
    # patch into the working tree, producing a passing `git diff --cached` with
    # zero actual problem-solving. We sever discovery by dropping ALL refs
    # (branches/tags/remotes) + the reflog and re-pointing HEAD at base, so
    # `git log`/branch/tag/reflog reveal nothing past base_commit. This does
    # NO working-tree re-hash (the old `rm -rf .git; git add -A` re-hashed every
    # file → ~10s on django, timing out at startup_timeout under colocated
    # concurrency → trajectories died at step 0 with no patch); this ref-drop is
    # ~0.15s. `git status`, `git diff`, `git diff --cached`, `git checkout -- <file>`,
    # `git show HEAD:<file>`, and the canonical submission command all still work.
    # (The fix objects remain unreachable-but-present; primary cheat defense is
    # the training-side filter in data_processing/strip_redundant.py.)
    if [ -d /testbed/.git ]; then
        (
            set -e
            cd /testbed
            BASE=$(git rev-parse HEAD)
            git for-each-ref --format='delete %(refname)' refs | git update-ref --stdin
            git update-ref refs/heads/base "$BASE"
            git symbolic-ref HEAD refs/heads/base
            git reflog expire --all --expire=now
        )
        echo "[startup] /testbed/.git history severed at base (refs+reflog dropped, no rehash)"
        # Baseline-commit the image's OWN uncommitted setup edits so submissions
        # contain only agent work. sweb.eval images ship harness-applied,
        # UNCOMMITTED worktree edits (sphinx: tox.ini gains `-rA` via upstream
        # pre_install; astropy: a pyproject.toml pin). Without this commit,
        # `git add -A && git diff --cached` sweeps those hunks into every
        # submission; at grade time the fresh container already has them, git
        # apply fails on the preimage, and the `patch --batch` fallback detects
        # "previously applied" and applies the hunk IN REVERSE — for sphinx that
        # strips -rA, pytest prints no per-test result lines, the log parser
        # finds nothing, and every sphinx traj grades unresolved (measured: 0
        # solves in 14,030 release trajs; gold patches DO resolve). Tracked
        # files only (-a); ~no-op on clean images; cheap (index intact, no
        # rehash). See eval/FINDINGS_sphinx_grading_bug.md.
        if ! git -C /testbed diff --quiet HEAD 2>/dev/null; then
            git -C /testbed -c user.email=eval@nanoswe -c user.name=nanoswe-eval \
                commit -aqm "harness baseline (image setup edits, pre-agent)"
            echo "[startup] baseline-committed image setup edits (submissions = agent-only diffs)"
        fi
    fi
