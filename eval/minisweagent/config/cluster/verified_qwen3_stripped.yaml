    chmod +x /usr/local/bin/str_replace
    command -v python3 >/dev/null || ln -sf "$(command -v python)" /usr/local/bin/python3
    str_replace --help 2>/dev/null || true
    echo "[startup] str_replace installed at /usr/local/bin/str_replace"
    # Mitigation A — git-history scrub. SWE-bench Verified containers ship
    # /testbed/.git with FULL upstream history past base_commit, including the
    # fix commit for the very issue being evaluated. Production failure mode:
    # agent runs `git log` -> finds the fix commit -> `git checkout <fix_sha>
    # -- .` -> submit. `git diff --cached` then emits the gold patch with no
    # problem-solving.
    #
    # Re-init .git as a single-commit repo at the current (bug-commit) working
    # tree. Submission flow (`git add -A && git diff --cached`) and surface
    # ops (`git status`, `git checkout -- <file>`, `git show HEAD:<file>`)
    # still work. Cheat ops (`git log`, `git show <hash>`, `git blame`,
    # `git checkout <hash>`) are dead. Grading is unaffected because the
    # SWE-bench grader applies diff text to a fresh container.
    if [ -d /testbed/.git ]; then
      cd /testbed
      rm -rf .git
      git init -q
      git -c user.email=eval@local -c user.name=eval add -A
      git -c user.email=eval@local -c user.name=eval commit -qm "base" --allow-empty
    fi
  salvage_command: git add -A && git diff --cached
